name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --frozen
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Type-check
        run: make typecheck
      - name: Unit tests
        run: uv run --frozen pytest -m "not integration" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore

  typescript:
    name: TypeScript — format, types, lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated API types match the server
        run: |
          uv sync --all-packages --frozen
          pnpm gen:api
          git diff --exit-code -- packages/api-client \
            || { echo "::error::API types are stale — run 'pnpm gen:api' and commit"; exit 1; }
      - name: Format
        run: pnpm format:check
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  infra-lint:
    name: Infra — workflows, Dockerfiles, shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash)
          ./actionlint -color
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The CLI (checksum-verified) scans the full history on every run; the
      # wrapper action computes a commit range that breaks on a root commit.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --verbose .

  stack:
    name: Docker stack boots healthy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Generate throwaway .env
        run: make env
      - name: Generate throwaway dev CA + broker certificate (MQTT over TLS)
        run: make certs
      - name: Build images and start the full stack (infra + api, decision, worker)
        run: make up-all
      - name: Verify extensions
        run: |
          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT extname FROM pg_extension ORDER BY 1"' \
            | tee /dev/stderr | grep -qx postgis
      - name: API readiness through the container
        run: curl -fsS localhost:8000/health/ready
      - name: Integration tests (real Postgres/PostGIS, Redis, MQTT)
        run: |
          uv sync --all-packages --frozen
          set -a && . ./.env && set +a
          uv run --frozen pytest -m integration
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
