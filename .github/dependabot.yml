version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) drops the JS compiler API that
      # openapi-typescript and typescript-eslint depend on.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/infra/postgres]
    schedule: { interval: weekly }
    commit-message: { prefix: build }
    ignore:
      # A Postgres major upgrade needs a planned data migration (pg_upgrade or
      # dump/restore) — never an automatic bump.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
