name: Feature
description: A capability traced to the PRD (AIL-xx) or the SRS
labels: ["type: feature"]
body:
  - type: input
    id: req
    attributes:
      label: Requirement ID
      description: PRD feature ID (e.g. AIL-09) or "new"
      placeholder: AIL-09
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What capability exists when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable conditions.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Design notes / links
