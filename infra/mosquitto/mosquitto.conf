# Eclipse Mosquitto 2 — edge → cloud telemetry broker.
#
# Every client authenticates; anonymous access is off. Topic-level permissions
# live in the ACL file so a compromised edge node can only publish its own
# telemetry, never commands or another node's data.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Plain listener for the compose network and loopback. The TLS listener (8883) is
# written into conf.d by the entrypoint once certificates exist (make certs); edge
# nodes off this machine connect only over TLS.
listener 1883 0.0.0.0

include_dir /mosquitto/config/conf.d
