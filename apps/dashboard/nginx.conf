# Console: static SPA + same-origin proxy to the API and its WebSocket.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # The console embeds the edge camera preview from 127.0.0.1:8090 (loopback only).
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com https://services.arcgisonline.com http://127.0.0.1:8090 http://localhost:8090; connect-src 'self' ws: wss: https://server.arcgisonline.com https://services.arcgisonline.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;   # agent triage can take a while
  }

  location /ws {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # `expires`, not add_header: a location-level add_header would silently drop the
  # server-level security headers above.
  location /assets/ {
    expires 1y;    # content-hashed file names
  }

  location / {
    try_files $uri /index.html;
    expires -1;    # always revalidate index.html
  }
}
