[project]
name = "pids-sim"
version = "0.1.0"
description = "PIDS scenario simulator: labelled ground truth through the same contracts as real sensors."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["pids-core", "numpy>=2.2"]

[project.scripts]
pids-sim = "pids_sim.cli:main"

[tool.uv.sources]
pids-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pids_sim"
