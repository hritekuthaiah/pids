[project]
name = "pids-ml"
version = "0.1.0"
description = "PIDS model training (anomaly detector, fusion calibration), edge benchmarks and evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "pids-core",
  "pids-sim",
  "numpy>=2.2",
  "scikit-learn>=1.7",
  "joblib>=1.5",
]

[project.scripts]
pids-train = "pids_ml.cli:main"

[tool.uv.sources]
pids-core = { workspace = true }
pids-sim = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pids_ml"
