# ---------------------------------------------------------------------------
# Demo Room — the live-demo compound: one room, one camera high in a corner.
#
# Local metres from the room's south-west floor corner: east along the south
# wall, north along the west wall. Measure the real room and edit the polygons;
# tape the zone outlines on the floor so the audience can see them.
#
# Before the demo, set `origin` to the room's real coordinates (a GPS fix at the
# south-west corner, or a map lookup) so the console map lands on the building.
# ---------------------------------------------------------------------------
site:
  id: demo-room
  name: "Demo Room — live camera compound"
  origin: { lat: 13.262000, lon: 77.420000 }
  timezone: Asia/Kolkata

zones:
  # The whole watched floor. Walking in is not an intrusion by itself.
  - id: room-warning
    name: Watched Floor
    kind: warning
    polygon: [[0.0, 0.0], [8.0, 0.0], [8.0, 6.0], [0.0, 6.0]]
    actions:
      warning: [dashboard, push]
      critical: [dashboard, push, siren]

  # The protected core (e.g. a desk standing in for a vault). Entering it
  # without an authorised badge IS the intrusion.
  - id: secure-core
    name: Secure Core
    kind: critical
    polygon: [[4.5, 0.6], [7.4, 0.6], [7.4, 3.2], [4.5, 3.2]]
    actions:
      warning: [dashboard, push]
      critical: [dashboard, push, siren]

nodes:
  # Camera high in the north-west corner looking across the room. Position and
  # heading are used for coverage and plausibility; the floor homography from
  # `pids-edge calibrate` is what actually places people.
  - id: edge-01
    position: [0.3, 5.7]
    heading_deg: 125
    fov_deg: 70
    range_m: 12

readers: []

tags:
  # Team phones acting as passive BLE badges (ADR-0011, upcoming).
  - { id: badge-team-1, label: "Team badge 1", kind: person }
  - { id: badge-team-2, label: "Team badge 2", kind: person }

features:
  gates:
    door: [1.2, 0.0]
