# PIDS local stack.
#
#   make up        -> infrastructure only (db, redis, mqtt) for native dev
#   make up-all    -> + application services (added as they are built)
#
# Every service has a healthcheck, and dependants wait on `service_healthy`, so
# `docker compose up --wait` returns only when the whole stack is usable.
name: pids

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    build:
      context: infra/postgres
    image: pids/postgres:17-postgis-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mqtt:
    <<: *restart
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/docker-entrypoint-pids.sh"]
    environment:
      MQTT_USERS: >-
        ${MQTT_SERVER_USER:?set in .env}:${MQTT_SERVER_PASSWORD:?set in .env}
        ${MQTT_EDGE_USER:?set in .env}:${MQTT_EDGE_PASSWORD:?set in .env}
        ${MQTT_SIM_USER:-pids-sim}:${MQTT_SIM_PASSWORD:?set in .env}
      MQTT_HEALTH_USER: ${MQTT_SERVER_USER}
      MQTT_HEALTH_PASSWORD: ${MQTT_SERVER_PASSWORD}
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/docker-entrypoint.sh:/docker-entrypoint-pids.sh:ro
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - mqttdata:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h localhost -p 1883 -u "$${MQTT_HEALTH_USER}" -P "$${MQTT_HEALTH_PASSWORD}"
          -t '$$SYS/broker/uptime' -C 1 -W 3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ------------------------------------------------------------ application
  # `make up-all` (profile "app"): containerised server processes. During
  # development they can equally run natively (`make dev-*`).
  migrate:
    profiles: [app]
    image: pids/server:dev
    build: { context: ., dockerfile: apps/server/Dockerfile }
    # schema migrations, then an idempotent seed of the site (and of the demo
    # accounts whose SEED_* passwords are present in .env)
    command:
      - sh
      - -c
      - alembic -c apps/server/alembic.ini upgrade head && pids-admin seed --site "$${PIDS_SITE_CONFIG:-config/sites/site-alpha.yaml}" && pids-admin index-procedures --dir config/sops
    env_file: .env
    environment: &app-env
      POSTGRES_HOST: db
      REDIS_HOST: redis
      MQTT_HOST: mqtt
      # the live site; override per run: PIDS_SITE_CONFIG=config/sites/demo-room.yaml make up-all
      PIDS_SITE_CONFIG: ${PIDS_SITE_CONFIG:-config/sites/site-alpha.yaml}
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *restart
    profiles: [app]
    image: pids/server:dev
    pull_policy: never  # built by the migrate service
    command: ["pids-api"]
    env_file: .env
    environment: *app-env
    ports:
      # loopback by default; `make up-lan` exposes it so guard phones on the LAN can connect
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on: &app-deps
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mqtt: { condition: service_healthy }

  decision:
    <<: *restart
    profiles: [app]
    image: pids/server:dev
    pull_policy: never  # built by the migrate service
    command: ["pids-decision"]
    env_file: .env
    environment: *app-env
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: *app-deps

  worker:
    <<: *restart
    profiles: [app]
    image: pids/server:dev
    pull_policy: never  # built by the migrate service
    command: ["pids-worker"]
    env_file: .env
    environment: *app-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on: *app-deps

  # ---------------------------------------------------------- observability
  # `make obs` (profile "obs"): Prometheus scrapes api / decision / worker;
  # Grafana serves the provisioned "PIDS — operations" dashboard on :3000.
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.13.4
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    profiles: [obs]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}  # required by `make obs`
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pids-operations.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mqttdata:
  prometheus-data:
  grafana-data:
